# BLT-D on TinyStories, 300k steps, paper-exact loss (Fast-BLT Eq. 5 + 6 + 7).
corpus: data/tinystories/train.bin
eval-corpus: data/tinystories/heldout.bin
embed: 256
hidden: 512
enc-layers: 2
glob-layers: 6
dec-layers: 2
steps: 300000
optimizer: adamw
lr: 0.0001
beta1: 0.9
beta2: 0.999
eps: 1.0e-8
weight-decay: 0.01
max-norm: 20000
paper-loss: 1
mask-scale: 1.0
diffusion: 1
block-size: 4
window: 512
t-min: 0.1
cross-attn: all
seed: 7
report-every: 1000
cuda-scratch-mb: 1024
entropy-patches: true
entropy-lm: runs/entropylm/entropy_lm.fblt
monitor-every: 10000
monitor-windows: 48
eval-windows: 200
save-weights: runs/tinystories_paper_360k.fblt
save-every: 10000
