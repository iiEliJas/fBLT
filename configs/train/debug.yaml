# Quick smoke test config
#
# Paper-exact loss (Fast-BLT Eq. 5 + 6 + 7). paper-loss makes L_clean a sum
# rather than a mean, which scales the gradient by ~clean_rows, so lr,
# max-norm and mask-scale move with it rather than being changed alone.
# Values match the 30k-step probe recipe that was validated;
# see docs/experiments/paper_loss_probe.md.
corpus: data/train.bin
embed: 32
hidden: 64
layers: 1
steps: 10
optimizer: adamw
lr: 0.0001
paper-loss: 1
mask-scale: 1.0
max-norm: 20000
diffusion: 1
block-size: 4
window: 16
report-every: 5
