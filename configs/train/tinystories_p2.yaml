# BLT-D on TinyStories, 600k steps, paper-exact loss (Fast-BLT Eq. 5 + 6 + 7).
# Same architecture as the 20k dev checkpoint so results stay comparable.
#
# Loss mode
#   --paper-loss 1  -> L_clean is a SUM (Eq. 5) and L_mask a SUM (Eq. 6).
#                     The 1/t factor and the sum over masked cells were already
#                     paper-exact; L_clean being a mean was the sole deviation.
#   --mask-scale 1.0 -> Eq. 7 is an unweighted sum. The 0.3 used in the repo's
#                     toy configs is a stabilization, not the paper.
#
# max-norm is measured, not guessed. A 30-step probe of this exact config with
# --max-norm disabled gave pre-clip gradient norms of 9023 / 11202 / 17860
# (min / median / max). The 1.98x max/min spread is the important part: a
# near-constant rescale cancels in Adam's m/sqrt(v), so setting the threshold
# just above the observed max makes clipping effectively inert instead of
# injecting step-to-step noise into the moment estimates.
#
# lr 1e-4 with AdamW. Under paper-loss the update norm is ~lr*sqrt(num_params)
# ~= 0.28, which is a sane step; treat the first 2k steps as burn-in and confirm
# L_mask falls steadily rather than spiking.
corpus: data/tinystories/train.bin
eval-corpus: data/tinystories/heldout.bin
load-weights: runs/tinystories_300k/tinystories_paper_360k.fblt
embed: 256
hidden: 512
enc-layers: 2
glob-layers: 6
dec-layers: 2
steps: 300000
optimizer: adamw
lr: 0.0001
beta1: 0.9
beta2: 0.999
eps: 1.0e-8
weight-decay: 0.01
max-norm: 20000
paper-loss: 1
mask-scale: 1.0
diffusion: 1
block-size: 4
window: 512
t-min: 0.1
cross-attn: all
seed: 7
report-every: 1000
scratch-mb: 2048
cuda-scratch-mb: 1024
entropy-patches: true
entropy-lm: runs/entropylm/entropy_lm.fblt
# Leak tripwire: logs L_clean, L_mask, masked_bpb and train-vs-aligned-novel
# accuracy at t=1.0, and aborts (exit 3) if train accuracy exceeds 0.95 or
# train exceeds aligned-novel by more than 0.10 after 5k steps.
monitor-every: 10000
monitor-windows: 48
eval-windows: 200
save-weights: runs/tinystories_paper_600k.fblt
save-every: 10000
