# BLT-D on TinyStories, 2048-byte window.
#
# Phase 2 of 2. Resumes configs/train/tinystories_2k_phase1.yaml.
#
# `load_weights` + `load_optim` together make this a true resume: the AdamW
# moments and the step counter come back, so the run continues rather than
# restarting the optimizer cold. `steps` is the budget for THIS invocation, added
# on top of the phase 1 total, so the two step counts add up.
#
# Everything else must match phase 1 exactly. A config mismatch shows up as a
# fatal shape error on load, which is the intended failure mode.

corpus: data/tinystories/train.bin
eval-corpus: data/tinystories/heldout.bin

embed: 256
hidden: 512
enc-layers: 2
glob-layers: 6
dec-layers: 2

steps: 100000

optimizer: adamw
lr: 0.0001
beta1: 0.9
beta2: 0.999
eps: 1.0e-8
weight-decay: 0.01
max-norm: 20000

paper-loss: 1
mask-scale: 1.0
diffusion: 1
block-size: 4

window: 2048

t-min: 0.1
cross-attn: all
seed: 7
report-every: 1000
cuda-scratch-mb: 2048

entropy-patches: true
entropy-lm: runs/entropylm/entropy_lm.fblt

monitor-every: 10000
monitor-windows: 48
eval-windows: 200
eval-every: 10000

load-weights: runs/tinystories_2k/phase1.fblt
load-optim: runs/tinystories_2k/phase1.fbop

save-weights: runs/tinystories_2k/phase2.fblt
save-optim: runs/tinystories_2k/phase2.fbop
save-every: 10000