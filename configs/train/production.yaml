# 2.97M-parameter BLT-D training
# corpus must point to your own full training data (not included in repo).
# For a quick start with sample data, use configs/train/debug.yaml instead
#
# Paper-exact loss (Fast-BLT Eq. 5 + 6 + 7). paper-loss makes L_clean a sum
# rather than a mean, scaling the gradient by ~clean_rows, so lr, max-norm and
# mask-scale move with it rather than being changed alone. Values follow the
# 30k-step probe recipe; see docs/experiments/paper_loss_probe.md.
corpus: data/corpus.bin
embed: 192
hidden: 384
layers: 2
steps: 40000
optimizer: adamw
lr: 0.0001
lr-decay: 1
paper-loss: 1
mask-scale: 1.0
max-norm: 20000
diffusion: 1
block-size: 4
window: 48
t-min: 0.1
t-warmup-hi: 0.25
t-hi-start: 0.8
cross-attn: all
