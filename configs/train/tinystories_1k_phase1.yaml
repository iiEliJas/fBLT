# BLT-D on TinyStories, 1024-byte window.
#
# Phase 1 of 2. Trains from random init. Phase 2 is
# configs/train/tinystories_1k_continue.yaml, which resumes this file's output.
#
# Same hyper-parameters as configs/train/tinystories.yaml except the window.
# `--steps` here is the budget for THIS invocation; the phase 2 config adds its
# own steps on top and continues the step counter from the optimizer snapshot.
#
# Window 1024 needs ~200 patches against ~98 at 512. Because diffusion scores
# every patch at once the memory grows faster than the window: measured peak is
# 4867 MiB of 8188 on an RTX 4060, about 59% of the card, with a 1 GB scratch
# arena. Window 2048 was measured at 96% of the same card and is why this is 1024.

corpus: data/tinystories/train.bin
eval-corpus: data/tinystories/heldout.bin

embed: 256
hidden: 512
enc-layers: 2
glob-layers: 6
dec-layers: 2

steps: 60000

optimizer: adamw
lr: 0.0001
beta1: 0.9
beta2: 0.999
eps: 1.0e-8
weight-decay: 0.01
max-norm: 20000

paper-loss: 1
mask-scale: 1.0
diffusion: 1
block-size: 4

# The long part: 1024 instead of 512.
window: 1024

t-min: 0.1
cross-attn: all
seed: 7
report-every: 1000
cuda-scratch-mb: 2048
scratch-mb: 1024

entropy-patches: true
entropy-lm: runs/entropylm/entropy_lm.fblt

monitor-every: 10000
monitor-windows: 48
eval-windows: 200
eval-every: 10000

save-weights: runs/tinystories_1k/phase1.fblt
save-optim: runs/tinystories_1k/phase1.fbop
save-every: 10000

# NOTE on inference: these configs pin save-weights to a fixed path so phase 2 can
# reference phase 1's output, but fblt-train writes resolved_config.yaml into its
# own run directory (runs/<run-name>/). fblt-infer auto-detects model shapes from
# a resolved_config.yaml found next to the checkpoint, so with a pinned path it
# will not find one. Pass the shape flags explicitly:
#
#   fblt-infer --checkpoint runs/tinystories_1k/phase2.fblt --embed 256 --hidden 512 \
#     --enc-layers 2 --glob-layers 6 --dec-layers 2 \
#     --entropy-lm runs/entropylm/entropy_lm.fblt --block-size 4 \
#     --prompt "Once upon a time" --new-bytes 200 --method blockdv
