[project]
name = "fblt-torch"
version = "0.1.0"
description = "Native PyTorch BLT/BLT-D"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "numpy",
  "pyyaml",
  "tomllib; python_version < '3.11'",
]

[tool.uv]
dev-dependencies = ["pytest", "ruff", "pyright"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
