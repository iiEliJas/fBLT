# CI workflow for fBLT — Fast Byte Latent Transformer
# Runs on every push to main and on pull requests targeting main.
# Jobs: Linux build+test, macOS build+test, sanitizer (ASan+UBSan),
#       CUDA syntax check (compile-only, no GPU required).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Permissions ──────────────────────────────────────────────────────
# Minimal permissions: read-only checkout.  No write, no secrets.
permissions:
  contents: read

# ── Concurrency ──────────────────────────────────────────────────────
# Cancel in-progress runs for the same PR / branch.  Keeps CI snappy
# when pushing rapid-fire commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ====================================================================
  # 1. Linux build + test (gcc, default C99 flags)
  # ====================================================================
  # Verifies the baseline build and test suite on the primary platform.
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Show build config
        run: make info

      - name: Build and run tests
        run: make test

      - name: Clean build artifacts
        if: always()
        run: make clean

  # ====================================================================
  # 2. macOS build + test (clang, OpenMP via Homebrew)
  # ====================================================================
  # Catches platform-specific issues: POSIX headers, clang warnings,
  # macOS linker quirks.  libomp provides OpenMP support on macOS.
  macos-test:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: brew install libomp

      - name: Show build config
        run: make info

      - name: Build and run tests
        run: make CC=clang LDLIBS="-lm -lomp" test

      - name: Clean build artifacts
        if: always()
        run: make clean

  # ====================================================================
  # 3. Sanitizer job (ASan + UBSan)
  # ====================================================================
  # Compiles the full codebase and test suite with AddressSanitizer and
  # UndefinedBehaviorSanitizer enabled, then runs the test suite.
  # Catches out-of-bounds access, use-after-free, integer overflow,
  # null-pointer dereferences, and other UB at runtime.
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Show build config
        run: make info CC=gcc CFLAGS="-O1 -g -std=c99 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude -Itests -Itools -D_POSIX_C_SOURCE=200809L" LDLIBS="-lm"

      - name: Build and run tests with sanitizers
        run: make CC=gcc CFLAGS="-O1 -g -std=c99 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude -Itests -Itools -D_POSIX_C_SOURCE=200809L" LDLIBS="-lm" test

      - name: Clean build artifacts
        if: always()
        run: make clean

  # ====================================================================
  # 4. CUDA syntax check (compile-only, no GPU)
  # ====================================================================
  # Installs the NVIDIA CUDA toolkit and runs `nvcc --syntax-only` on
  # every .cu file in src/backend_cuda/.  This validates that CUDA
  # source compiles correctly without needing a physical GPU.  Does NOT
  # link or execute anything — just parses for syntax/semantic errors.
  cuda-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install CUDA toolkit
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu-2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-12-8

      - name: Syntax-check CUDA sources
        run: |
          CUDA_NVCC=/usr/local/cuda-12.8/bin/nvcc
          FAILURES=0
          for cu_file in src/backend_cuda/*.cu; do
            echo "  checking: $cu_file"
            if $CUDA_NVCC --syntax-only --std=c++17 -Iinclude -DBLT_WITH_CUDA "$cu_file"; then
              echo "    OK"
            else
              echo "    FAILED"
              FAILURES=$((FAILURES + 1))
            fi
          done
          if [ "$FAILURES" -ne 0 ]; then
            echo "CUDA syntax check failed in $FAILURES file(s)."
            exit 1
          fi
          echo "All CUDA files pass syntax check."
