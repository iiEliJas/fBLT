[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fblt"
version = "0.1.0"
description = "Fast Byte Latent Transformer"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "iiEliJas"}]
urls = {Homepage = "https://github.com/iiEliJas/fBLT", Repository = "https://github.com/iiEliJas/fBLT"}
requires-python = ">=3.9"
dependencies = ["pyyaml"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
data = ["datasets"]
plots = ["matplotlib", "numpy"]
parity = ["torch", "numpy"]
tracking = ["wandb"]

[tool.setuptools.packages.find]
include = ["fblt*"]

[project.scripts]
fblt-train = "fblt.train:main"
fblt-infer = "fblt.infer:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests/py"]
